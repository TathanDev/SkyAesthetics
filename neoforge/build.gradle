import org.gradle.jvm.tasks.Jar

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    // Apply the common access widener in the dev environment.
    accessWidenerPath = project(':common').loom.accessWidenerPath

    neoForge {
        // NeoForge has no native access widener support, so Loom 1.17's AW -> AT
        // conversion rewrites the bundled access widener into an access
        // transformer at META-INF/accesstransformer.cfg (the path NeoForge loads
        // by default) and strips the AW from the jar.
        //
        // The conversion is wired onto `shadowJar` because that is the task
        // whose output actually contains `sky_aesthetics.accessWidener` (pulled
        // in from the common module) and is the published artifact. As this is a
        // no-remap build, the names are already official, so no remapJar pass is
        // needed.
        convertAccessWideners(tasks.named('shadowJar', Jar), 'sky_aesthetics.accessWidener')
    }

    runs {
        data {
            data()
            programArgs '--all', '--mod', 'sky_aesthetics'
            programArgs '--output', project(':common').file('src/main/generated/resources').absolutePath
        }
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url 'https://modmaven.dev/'
        content {
            includeGroup 'dev.technici4n'
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
}
